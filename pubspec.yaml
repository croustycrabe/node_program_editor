name: node_program_editor
description: >-
  A high-performance, fully customizable node graph editor engine for Flutter
  (React Flow for Flutter). Build LabVIEW, Simulink, n8n or vision-pipeline
  style editors with zero external dependencies.
version: 3.0.0
homepage: https://github.com/avagst3/node_program_editor
repository: https://github.com/avagst3/node_program_editor
topics:
  - node-editor
  - graph
  - visual-programming
  - flow
  - diagram

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/grid.frag
    - shaders/edge_flow.frag
